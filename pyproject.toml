[project]
name = "todo-a-markdown"
version = "0.1.2"
description = "Convierte EPUB, PDF, DOCX, PPTX, XLSX y HTML a Markdown limpio para Obsidian y LLM, con informe de calidad."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Mack Chirinos" }]
requires-python = ">=3.11,<3.15"
dependencies = [
    "lxml>=5",
    "pymupdf>=1.26",
    "pymupdf4llm>=2.0",
    "markitdown[docx,pptx,xlsx]>=0.1",
]

[project.optional-dependencies]
ocr = ["rapidocr>=3"]
docling = ["docling>=2"]

[project.scripts]
todo-a-markdown = "todo_a_markdown.cli:main"

[dependency-groups]
dev = ["python-docx>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
