name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    # Windows es el sistema donde más se usa (consola CP-1252, rutas con espacios y tildes).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run python -m unittest discover -s tests -v
